services:
  ollama:
    image: ollama/ollama:latest
    container_name: opencode-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
    command: serve
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  pull-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "ollama pull qwen2.5-coder:7b"
    restart: "no"

  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-docker
    depends_on:
      ollama:
        condition: service_healthy
      pull-model:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./workspace:/workspace
      - ./data:/root/.local/share/opencode
    environment:
      OPENAI_API_KEY: "ollama"
      OPENAI_BASE_URL: "http://ollama:11434/v1"
      OPENAI_MODEL: "qwen2.5-coder:7b"
      OPENCODE_MODEL: "qwen2.5-coder:7b"
    restart: unless-stopped

volumes:
  ollama-data:
