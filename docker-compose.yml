version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: opencode-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: "*"
    command: serve
    restart: unless-stopped

  pull-model:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        until curl -fsS http://ollama:11434/api/tags >/dev/null 2>&1; do sleep 2; done; ollama pull qwen2.5-coder:7b
    restart: "no"

  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-docker
    depends_on:
      - ollama
      - pull-model
    ports:
      - "3000:4096"
    volumes:
      - ./workspace:/workspace
      - ./data:/root/.local/share/opencode
    environment:
      OPENAI_API_KEY: "ollama"
      OPENAI_BASE_URL: "http://ollama:11434/v1"
      OPENAI_MODEL: "qwen2.5-coder:7b"
      OPENCODE_MODEL: "qwen2.5-coder:7b"
      OPENCODE_HOSTNAME: "0.0.0.0"
      OPENCODE_PORT: "4096"
    command: ["serve", "--host", "0.0.0.0", "--port", "4096"]
    restart: unless-stopped

volumes:
  ollama-data:
