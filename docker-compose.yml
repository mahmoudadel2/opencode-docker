services:
  ollama:
    image: ollama/ollama:latest
    container_name: opencode-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
    command: >
      /bin/sh -lc "ollama serve &
      sleep 10
      ollama pull zerocopia/qwen3-coder-next:cloud
      wait"
    restart: unless-stopped

  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-docker
    depends_on:
      - ollama
    ports:
      - "3000:3000"
    volumes:
      - ./workspace:/workspace
      - ./data:/root/.local/share/opencode
    environment:
      OPENAI_API_KEY: "ollama"
      OPENAI_BASE_URL: "http://ollama:11434/v1"
      OPENAI_MODEL: "zerocopia/qwen3-coder-next:cloud"
      OPENCODE_MODEL: "zerocopia/qwen3-coder-next:cloud"
    restart: unless-stopped

volumes:
  ollama-data:
