services:
  ollama:
    image: ollama/ollama:latest
    container_name: opencode-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: "*"
      OLLAMA_CONTEXT_LENGTH: 16384
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
    command: serve
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: opencode-ollama-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen3:8b"]
    restart: "no"

  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-docker
    depends_on:
      - ollama
    ports:
      - "3000:4096"
    volumes:
      - ./workspace:/workspace
      - ./data:/root/.local/share/opencode
    environment:
      OPENAI_API_KEY: "ollama"
      OPENAI_BASE_URL: "http://ollama:11434/v1"
      OPENAI_MODEL: "qwen3:8b"
      OPENCODE_MODEL: "qwen3:8b"
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    restart: unless-stopped

volumes:
  ollama-data:
